#:schema https://rlbot.org/schemas/agent.json
[settings]
name = "BotBoi"
agent_id = "rafe/botboi"
loadout_file = "loadout.toml"
# Commands run from this folder. setup_windows.ps1 creates .\venv.
run_command = "venv\\Scripts\\python.exe bot.py"
